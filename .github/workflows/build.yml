name: Build module

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore public packages and determine nexo SDK version
        id: dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore Nexo.TestConnect.csproj --source https://api.nuget.org/v3/index.json --nologo
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not restore public NuGet packages.'
          }

          $assets = Get-Content 'obj/project.assets.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $connection = @($assets.libraries.PSObject.Properties | Where-Object { $_.Name -like 'Zapqio.Nexo.Connection/*' })
          if ($connection.Count -ne 1) {
            throw 'Expected one resolved Connection package.'
          }

          $propsPath = $null
          foreach ($folder in $assets.packageFolders.PSObject.Properties.Name) {
            $candidate = Join-Path $folder ($connection[0].Value.path + '/build/Zapqio.Nexo.Connection.props')
            if (Test-Path -LiteralPath $candidate) {
              $propsPath = $candidate
              break
            }
          }

          if (-not $propsPath) {
            throw 'The restored Connection package has no SDK settings.'
          }

          [xml]$props = Get-Content -LiteralPath $propsPath -Raw -Encoding UTF8
          $version = [string]$props.Project.PropertyGroup.NexoSdkVersion.InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid nexo SDK version: $version"
          }

          Write-Host "Resolved $($connection[0].Name), SDK $version"
          "sdk=$version" >> $env:GITHUB_OUTPUT

      - name: Cache nexo SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nexo-sdk
          key: nexo-sdk-${{ runner.os }}-${{ steps.dependencies.outputs.sdk }}-v1

      - name: Download nexo SDK
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          NEXO_SDK_VERSION: ${{ steps.dependencies.outputs.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shortVersion = ($env:NEXO_SDK_VERSION.Split('.')[0..2] -join '_')
          $archive = Join-Path $env:RUNNER_TEMP "nexoSDK_$shortVersion.exe"
          $destination = Join-Path $env:RUNNER_TEMP 'nexo-sdk'
          Invoke-WebRequest "https://ftp.insertcdn.pl/pub/aktualizacje/InsERT_nexo/nexoSDK_$shortVersion.exe" -OutFile $archive
          7z x $archive "-o$destination" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not extract the nexo SDK.'
          }

      - name: Publish module
        shell: pwsh
        env:
          NEXO_SDK_VERSION: ${{ steps.dependencies.outputs.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sdk = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'nexo-sdk') -Recurse -Filter InsERT.Moria.Sfera.dll | Select-Object -First 1
          if (-not $sdk -or $sdk.VersionInfo.ProductVersion.Split('+')[0] -ne $env:NEXO_SDK_VERSION) {
            throw 'The extracted SDK does not match the version required by Connection.'
          }

          $output = Join-Path $env:RUNNER_TEMP 'nexo-module-output'
          dotnet publish Nexo.TestConnect.csproj --no-restore -c Release -o "$output/publish" "-p:nexoSdkBinPath=$($sdk.DirectoryName)\" --nologo
          if ($LASTEXITCODE -ne 0) {
            throw 'Module compilation failed.'
          }

          $zip = Join-Path $output 'Nexo.TestConnect.zip'
          $package = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $reader = [IO.StreamReader]::new($package.GetEntry('##Dll').Open())
            try {
              $dll = $reader.ReadToEnd().Trim()
            }
            finally {
              $reader.Dispose()
            }

            if ($dll -ne 'Nexo.TestConnect.dll' -or -not $package.GetEntry($dll)) {
              throw 'Invalid module ZIP.'
            }

            if ($package.Entries | Where-Object { $_.Name -match '^(InsERT\.|Nexo\.Connection\.dll$|Zapqio\.Runner\.Module\.Core\.dll$)' }) {
              throw 'Shared runtime dependencies must not be included in this module.'
            }
          }
          finally {
            $package.Dispose()
          }

          Copy-Item -LiteralPath $zip -Destination (Join-Path $output 'module.zip')

      # Web selects the artifact for the exact commit chosen in the deployment.
      - name: Upload module for Web
        uses: actions/upload-artifact@v4
        with:
          name: zapqio-module
          path: ${{ runner.temp }}/nexo-module-output/module.zip
          if-no-files-found: error
          retention-days: 30
