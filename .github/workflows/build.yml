name: Build module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: '8.0.x'

      - name: Select the installed .NET 8 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:DOTNET_SDK_VERSION } } | ConvertTo-Json | Set-Content global.json

      - name: Restore public dependencies
        run: |
          dotnet restore tests/Template.Module.Tests/Template.Module.Tests.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Test dependency restore failed.'
          }

          dotnet restore tools/LocalRunner/LocalRunner.csproj --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) {
            throw 'Local runner dependency restore failed.'
          }

      - name: Test
        run: dotnet test tests/Template.Module.Tests/Template.Module.Tests.csproj -c Release --no-restore --nologo

      - name: Run the example
        run: dotnet run --project tools/LocalRunner/LocalRunner.csproj -c Release --no-restore -- examples/input.json

      - name: Publish module
        run: dotnet publish Template.Module.csproj -c Release --no-restore -o artifacts/publish --nologo

      - name: Check package
        run: ./tools/Test-Package.ps1 -PackagePath artifacts/module.zip

      # Web requires one artifact for the exact commit, with module.zip at its root.
      - name: Upload module for Web
        if: matrix.os == 'windows-latest' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: zapqio-module
          path: artifacts/module.zip
          archive: true
          if-no-files-found: error
          retention-days: 30
